; Claude Desktop Buddy — port ESP32-S3 Super Mini + écran rond GC9A01 + bouton tactile
; Pinout: voir WIRING.md

[env:s3-supermini]
platform = espressif32@6.9.0          ; arduino-esp32 2.0.17 (TFT_eSPI n'est pas compatible core 3.x)
board = lolin_s3_mini
framework = arduino
monitor_speed = 115200
; Upload avec l'esptool récent (pip install -U esptool): celui de PlatformIO (4.5.1) rate
; le reset automatique sur l'USB natif de l'S3 et oblige à passer en mode BOOT.
upload_protocol = custom
upload_command = python -m esptool --chip esp32s3 --port-filter vid=0x303A --baud 460800 --before default-reset --after hard-reset write-flash -z --flash-mode dio --flash-freq 80m --flash-size 4MB 0x0 $BUILD_DIR/bootloader.bin 0x8000 $BUILD_DIR/partitions.bin 0xe000 $PROJECT_PACKAGES_DIR/framework-arduinoespressif32/tools/partitions/boot_app0.bin 0x10000 $BUILD_DIR/firmware.bin
board_build.filesystem = littlefs
board_build.partitions = no_ota.csv
board_build.f_cpu = 240000000L
build_src_filter = +<*> +<buddies/>
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; --- TFT_eSPI (config inline, pas de User_Setup.h) ---
    -DUSER_SETUP_LOADED=1
    -DGC9A01_DRIVER=1
    -DUSE_FSPI_PORT=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MOSI=6
    -DTFT_SCLK=5
    -DTFT_CS=7
    -DTFT_DC=8
    -DTFT_RST=9
    -DTFT_MISO=-1
    -DSPI_FREQUENCY=40000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    ; --- Buddy ---
    -DBUDDY_BL_PIN=10
    -DBUDDY_TOUCH_PIN=4
    -DBUDDY_TOUCH_DIGITAL=1            ; module tactile externe (TTP223): sortie HAUTE quand touché
    ; -DBUDDY_TOUCH_ACTIVE_LOW=1       ; si la sortie du module est à l'état bas quand touché
    ; (retirer BUDDY_TOUCH_DIGITAL pour utiliser un simple fil/pad sur le tactile natif de l'S3)
    -DBUDDY_BTNB_PIN=2                 ; 2e module tactile: B = refuser/valider (commenter = mode 1 bouton à gestes)
    ; -DBUDDY_BUZZER_PIN=1             ; décommenter si buzzer passif branché
    ; -DBUDDY_LCD_INVERT=1             ; décommenter si les couleurs sont inversées
    ; -DBUDDY_DEBUG_LOG=1                ; journal USB toutes les 2 s (retirer en fin de debug)
    ; -DBUDDY_BOOT_TEST=1                ; rouge/vert/bleu plein écran au démarrage
    ; -DBUDDY_TOUCH_DEBUG=1            ; affiche les valeurs brutes du capteur tactile
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    bitbank2/AnimatedGIF @ ^2.1.1
    bblanchon/ArduinoJson @ ^7.0.0
